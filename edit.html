<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Data Shift</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f8fafc;
        padding: 20px;
      }
      .container {
        max-width: 1100px;
        margin: auto;
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      }
      h1 {
        font-size: 24px;
        margin-bottom: 5px;
        color: #1e293b;
      }
      .subtitle {
        color: #64748b;
        margin-bottom: 20px;
      }

      .tab-nav {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .tab-btn {
        background: #e2e8f0;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .tab-btn.active {
        background: #3b82f6;
        color: white;
      }

      .btn {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
      }
      .btn-danger {
        background: #ef4444;
      }
      .btn-small {
        padding: 6px 10px;
        font-size: 13px;
        margin: 2px;
      }
      .btn-green {
        background: #16a34a;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }
      th,
      td {
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
        font-size: 14px;
      }
      th {
        background: #f1f5f9;
      }

      .shift-group {
        margin-bottom: 30px;
      }
      .shift-group h3 {
        font-size: 18px;
        margin-bottom: 10px;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 5px;
      }

      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
        align-items: center;
        justify-content: center;
      }
      .modal-overlay.active {
        display: flex;
      }
      .modal-box {
        background: white;
        border-radius: 16px;
        padding: 30px;
        max-width: 500px;
        width: 100%;
      }
      .modal-box h2 {
        margin-bottom: 15px;
      }

      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 14px;
      }

      .message {
        margin-top: 15px;
        padding: 10px;
        border-radius: 8px;
        display: none;
      }
      .success {
        background: #dcfce7;
        color: #16a34a;
      }
      .error {
        background: #fee2e2;
        color: #dc2626;
      }

      .text-red {
        color: #dc2626;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🛠️ Edit Data Shift</h1>
      <p class="subtitle">Ubah data absensi dengan tampilan rekapan shift</p>

      <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('karyawan')">
          👤 Karyawan
        </button>
        <button class="tab-btn" onclick="switchTab('shift')">📋 Shift</button>
      </div>

      <!-- Tab Karyawan -->
      <div id="karyawan-tab">
        <h3>Daftar Karyawan</h3>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nama</th>
              <th>No. WA</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="karyawan-table-body"></tbody>
        </table>
      </div>

      <!-- Tab Shift (Rekapan) -->
      <div id="shift-tab" style="display: none">
        <div id="shift-container"></div>
      </div>

      <div id="message" class="message"></div>
    </div>

    <!-- Modal Edit Karyawan -->
    <div class="modal-overlay" id="editKaryawanModal">
      <div class="modal-box">
        <h2>Edit Karyawan</h2>
        <div class="form-group">
          <label>ID Karyawan</label>
          <input type="text" id="editKaryawanId" readonly />
        </div>
        <div class="form-group">
          <label>Nama</label>
          <input type="text" id="editKaryawanNama" />
        </div>
        <div class="form-group">
          <label>No. WhatsApp</label>
          <input type="text" id="editKaryawanNoWa" />
        </div>
        <button class="btn" onclick="simpanEditKaryawan()">Simpan</button>
        <button class="btn btn-danger" onclick="closeModal()">Batal</button>
      </div>
    </div>

    <!-- Modal Edit Shift -->
    <div class="modal-overlay" id="editShiftModal">
      <div class="modal-box">
        <h2>Edit Shift</h2>
        <div class="form-group">
          <label>ID Karyawan</label>
          <input type="text" id="editShiftKaryawanId" readonly />
        </div>
        <div class="form-group">
          <label>Waktu Masuk (YYYY-MM-DD HH:MM:SS)</label>
          <input
            type="text"
            id="editShiftMasukWaktu"
            placeholder="2026-09-04 08:00:00"
          />
        </div>
        <div class="form-group">
          <label>Lokasi Masuk</label>
          <input type="text" id="editShiftMasukLokasi" />
        </div>
        <div class="form-group" id="editShiftPulangGroup">
          <label>Waktu Pulang (YYYY-MM-DD HH:MM:SS)</label>
          <input
            type="text"
            id="editShiftPulangWaktu"
            placeholder="2026-09-04 17:00:00"
          />
        </div>
        <div class="form-group">
          <label>Lokasi Pulang</label>
          <input type="text" id="editShiftPulangLokasi" />
        </div>
        <button class="btn btn-green" onclick="simpanEditShift()">
          Simpan Perubahan
        </button>
        <button class="btn btn-danger" onclick="closeModal()">Batal</button>
      </div>
    </div>

    <script>
      // ===== KONFIGURASI SUPABASE =====
      const SUPABASE_URL = "https://wjiskmzydeesmmxxaqgv.supabase.co"; // GANTI DENGAN URL KAMU
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqaXNrbXp5ZGVlc21teHhhcWd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2OTcwOTksImV4cCI6MjEwMzI3MzA5OX0.GaBuPkkrhF_z2mvIIDv9Uy42V26nDftmQ3mjE-wK6_E"; // GANTI DENGAN KEY KAMU
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
      );

      let currentTab = "karyawan";
      let allData = [];
      let currentShift = null; // untuk menyimpan data shift yang sedang diedit

      // ===== FUNGSI FORMAT WIB =====
      function formatWIB(isoString) {
        if (!isoString) return "";
        const date = new Date(isoString);
        return date.toLocaleString("sv-SE", { timeZone: "Asia/Jakarta" }); // YYYY-MM-DD HH:MM:SS
      }

      // ===== LOAD DATA =====
      async function loadKaryawan() {
        const { data, error } = await supabaseClient
          .from("karyawan")
          .select("*")
          .order("id_karyawan");
        if (error) {
          showMessage("Gagal: " + error.message, "error");
          return;
        }
        const tbody = document.getElementById("karyawan-table-body");
        tbody.innerHTML = "";
        data.forEach((k) => {
          const row = `
                    <tr>
                        <td>${k.id_karyawan}</td>
                        <td>${k.nama}</td>
                        <td>${k.no_wa || "-"}</td>
                        <td><button class="btn btn-small" onclick="openEditKaryawan('${k.id_karyawan}', '${k.nama}', '${k.no_wa || ""}')">Edit</button></td>
                    </tr>`;
          tbody.innerHTML += row;
        });
      }

      async function loadShiftData() {
        const { data, error } = await supabaseClient
          .from("absensi")
          .select("*")
          .order("created_at", { ascending: true });
        if (error) {
          showMessage("Gagal: " + error.message, "error");
          return;
        }
        allData = data;
        buildShiftView();
      }

      // ===== BUAT TAMPILAN SHIFT (Rekapan) =====
      function buildShiftView() {
        const container = document.getElementById("shift-container");
        if (allData.length === 0) {
          container.innerHTML = "<p>Tidak ada data absensi.</p>";
          return;
        }

        // Kelompokkan per karyawan
        const grouped = {};
        allData.forEach((r) => {
          if (!grouped[r.id_karyawan])
            grouped[r.id_karyawan] = {
              id: r.id_karyawan,
              nama: r.nama,
              records: [],
            };
          grouped[r.id_karyawan].records.push(r);
        });

        let html = "";
        for (const [id, group] of Object.entries(grouped)) {
          const records = group.records.sort(
            (a, b) => new Date(a.created_at) - new Date(b.created_at),
          );
          const pairs = [];
          let currentMasuk = null;

          records.forEach((r) => {
            if (r.jenis === "Masuk") {
              if (currentMasuk)
                pairs.push({ masuk: currentMasuk, pulang: null });
              currentMasuk = r;
            } else if (r.jenis === "Pulang") {
              if (currentMasuk) {
                pairs.push({ masuk: currentMasuk, pulang: r });
                currentMasuk = null;
              } else {
                pairs.push({ masuk: null, pulang: r });
              }
            }
          });
          if (currentMasuk) pairs.push({ masuk: currentMasuk, pulang: null });

          if (pairs.length === 0) continue;

          html += `<div class="shift-group">
                    <h3>${group.nama} (${id})</h3>
                    <table class="shift-table">
                        <thead><tr>
                            <th>Masuk</th><th>Lokasi Masuk</th>
                            <th>Pulang</th><th>Lokasi Pulang</th>
                            <th>Durasi</th><th>Status</th><th>Aksi</th>
                        </tr></thead><tbody>`;

          pairs.forEach((pair) => {
            const masukWaktu = pair.masuk
              ? formatWIB(pair.masuk.created_at)
              : "-";
            const masukLokasi = pair.masuk ? pair.masuk.lokasi : "-";
            const pulangWaktu = pair.pulang
              ? formatWIB(pair.pulang.created_at)
              : '<span class="text-red">BELUM PULANG</span>';
            const pulangLokasi = pair.pulang ? pair.pulang.lokasi : "-";
            let durasi = "-",
              statusText = "",
              rowStyle = "";

            if (pair.masuk && pair.pulang) {
              const diffMs =
                new Date(pair.pulang.created_at) -
                new Date(pair.masuk.created_at);
              const diffHours = diffMs / 3600000;
              durasi = `${Math.floor(diffHours)} jam ${Math.round((diffHours % 1) * 60)} menit`;
              statusText = "✅ Lengkap";
            } else if (pair.masuk && !pair.pulang) {
              statusText = "⚠️ Belum Pulang";
              rowStyle = 'style="background:#fffbeb;"';
            } else if (!pair.masuk && pair.pulang) {
              statusText = "❓ Tidak Ada Masuk";
              rowStyle = 'style="background:#fee2e2;"';
            }

            // Simpan ID masuk dan pulang di atribut data
            const masukId = pair.masuk ? pair.masuk.id : null;
            const pulangId = pair.pulang ? pair.pulang.id : null;

            html += `<tr ${rowStyle}>
                        <td>${masukWaktu}</td><td>${masukLokasi}</td>
                        <td>${pulangWaktu}</td><td>${pulangLokasi}</td>
                        <td>${durasi}</td><td>${statusText}</td>
                        <td>
                            <button class="btn btn-small" onclick="openEditShift('${id}', '${group.nama}', ${masukId}, ${pulangId}, '${pair.masuk ? pair.masuk.created_at : ""}', '${pair.masuk ? pair.masuk.lokasi : ""}', '${pair.pulang ? pair.pulang.created_at : ""}', '${pair.pulang ? pair.pulang.lokasi : ""}')">Edit</button>
                        </td>
                    </tr>`;
          });

          html += "</tbody></table></div>";
        }

        container.innerHTML = html || "<p>Tidak ada data shift.</p>";
      }

      // ===== TAB SWITCH =====
      function switchTab(tab) {
        currentTab = tab;
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));
        document.getElementById("karyawan-tab").style.display =
          tab === "karyawan" ? "block" : "none";
        document.getElementById("shift-tab").style.display =
          tab === "shift" ? "block" : "none";

        if (tab === "karyawan") {
          document
            .querySelector(".tab-btn:nth-child(1)")
            .classList.add("active");
          loadKaryawan();
        } else {
          document
            .querySelector(".tab-btn:nth-child(2)")
            .classList.add("active");
          loadShiftData();
        }
      }

      // ===== MODAL KARYAWAN =====
      function openEditKaryawan(id, nama, noWa) {
        document.getElementById("editKaryawanId").value = id;
        document.getElementById("editKaryawanNama").value = nama;
        document.getElementById("editKaryawanNoWa").value = noWa;
        document.getElementById("editKaryawanModal").classList.add("active");
      }

      async function simpanEditKaryawan() {
        const id = document.getElementById("editKaryawanId").value;
        const nama = document.getElementById("editKaryawanNama").value;
        const noWa = document.getElementById("editKaryawanNoWa").value;
        const { error } = await supabaseClient
          .from("karyawan")
          .update({ nama, no_wa: noWa })
          .eq("id_karyawan", id);
        if (error) {
          showMessage("Gagal: " + error.message, "error");
          return;
        }
        showMessage("✅ Karyawan berhasil diupdate!", "success");
        closeModal();
        loadKaryawan();
      }

      // ===== MODAL SHIFT =====
      function openEditShift(
        idKaryawan,
        nama,
        masukId,
        pulangId,
        masukWaktu,
        masukLokasi,
        pulangWaktu,
        pulangLokasi,
      ) {
        currentShift = {
          idKaryawan: idKaryawan,
          nama: nama,
          masukId: masukId,
          pulangId: pulangId,
        };
        document.getElementById("editShiftKaryawanId").value = idKaryawan;
        document.getElementById("editShiftMasukWaktu").value = masukWaktu
          ? formatWIB(masukWaktu)
          : "";
        document.getElementById("editShiftMasukLokasi").value =
          masukLokasi || "";
        document.getElementById("editShiftPulangWaktu").value = pulangWaktu
          ? formatWIB(pulangWaktu)
          : "";
        document.getElementById("editShiftPulangLokasi").value =
          pulangLokasi || "";
        document.getElementById("editShiftModal").classList.add("active");
      }

      async function simpanEditShift() {
        // Ambil data dari modal
        const masukWaktu = document.getElementById("editShiftMasukWaktu").value;
        const masukLokasi = document.getElementById(
          "editShiftMasukLokasi",
        ).value;
        const pulangWaktu = document.getElementById(
          "editShiftPulangWaktu",
        ).value;
        const pulangLokasi = document.getElementById(
          "editShiftPulangLokasi",
        ).value;

        // Konversi ke ISO UTC
        const masukISO = new Date(masukWaktu).toISOString();
        const pulangISO = pulangWaktu
          ? new Date(pulangWaktu).toISOString()
          : null;

        // Update data Masuk
        if (currentShift.masukId) {
          const { error: errorMasuk } = await supabaseClient
            .from("absensi")
            .update({ created_at: masukISO, lokasi: masukLokasi })
            .eq("id", currentShift.masukId);
          if (errorMasuk) {
            showMessage("Gagal update masuk: " + errorMasuk.message, "error");
            return;
          }
        } else {
          // Jika tidak ada Masuk (aneh), kita tidak bisa insert karena tidak punya ID, tapi mungkin kita tambahkan?
          showMessage("Tidak ada data Masuk untuk diupdate!", "error");
          return;
        }

        // Update atau insert Pulang
        if (currentShift.pulangId) {
          // Update Pulang yang sudah ada
          if (pulangISO) {
            const { error: errorPulang } = await supabaseClient
              .from("absensi")
              .update({ created_at: pulangISO, lokasi: pulangLokasi })
              .eq("id", currentShift.pulangId);
            if (errorPulang) {
              showMessage(
                "Gagal update pulang: " + errorPulang.message,
                "error",
              );
              return;
            }
          }
        } else {
          // Tidak ada Pulang, insert baru
          if (pulangISO) {
            const { error: errorInsert } = await supabaseClient
              .from("absensi")
              .insert({
                id_karyawan: currentShift.idKaryawan,
                nama: currentShift.nama,
                jenis: "Pulang",
                lat: 0,
                lng: 0,
                lokasi: pulangLokasi,
                created_at: pulangISO,
              });
            if (errorInsert) {
              showMessage(
                "Gagal insert pulang: " + errorInsert.message,
                "error",
              );
              return;
            }
          }
        }

        showMessage("✅ Shift berhasil diupdate!", "success");
        closeModal();
        loadShiftData(); // refresh tampilan
      }

      // ===== UTIL =====
      function closeModal() {
        document
          .querySelectorAll(".modal-overlay")
          .forEach((m) => m.classList.remove("active"));
      }

      function showMessage(text, type) {
        const msg = document.getElementById("message");
        msg.textContent = text;
        msg.className = "message " + type;
        msg.style.display = "block";
        setTimeout(() => {
          msg.style.display = "none";
        }, 3000);
      }

      // ===== INIT =====
      loadKaryawan();
    </script>
  </body>
</html>
