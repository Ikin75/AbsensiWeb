<!doctype html>
<html>
  <head>
    <!-- ... (CSS sama persis seperti sebelumnya) ... -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <!-- ... (HTML form sama persis seperti sebelumnya) ... -->

    <script>
      // ===== KONFIGURASI =====
      const SUPABASE_URL = "https://xxxxxx.supabase.co"; // <-- GANTI
      const SUPABASE_KEY = "eyxxxxxx.xxxxxx"; // <-- GANTI
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const OFFICE_LOCATIONS = [
        // ... (data lokasi tetap seperti sebelumnya) ...
      ];

      // ... (fungsi geolocation, UI, dan popup tetap 100% sama) ...

      // ===== FUNGSI DATABASE BARU =====

      // Cek status karyawan berdasarkan data terakhir di Supabase
      async function checkStatusFromDB(id) {
        try {
          // Ambil 1 record terbaru untuk user ini
          const { data, error } = await supabase
            .from("absensi")
            .select("jenis")
            .eq("id_karyawan", id)
            .order("created_at", { ascending: false })
            .limit(1);

          if (error) throw error;

          // Kalau data ada, return jenisnya ('Masuk'/'Pulang'), kalau tidak 'belum'
          return data.length > 0 ? data[0].jenis.toLowerCase() : "belum";
        } catch (e) {
          console.error(e);
          return "error";
        }
      }

      // Simpan record absen
      async function simpanKeDB(id, nama, jenis, lat, lng, lokasi) {
        const { error } = await supabase.from("absensi").insert({
          id_karyawan: id,
          nama: nama,
          jenis: jenis,
          lat: lat,
          lng: lng,
          lokasi: lokasi || "Tidak diketahui",
        });
        if (error) throw error;
      }

      // ===== MODIFIKASI FUNGSI ABSEN =====
      async function absen(jenis) {
        // ... (validasi lokasi & karyawan tetap sama) ...

        showPopup("Memeriksa Status", "Menghubungi server...");

        const serverStatus = await checkStatusFromDB(currentKaryawan.id);

        if (serverStatus === "error") {
          showPopup("Error", "Gagal memvalidasi. Coba lagi.");
          return;
        }

        if (jenis === "Masuk" && serverStatus === "masuk") {
          showPopup("Gagal", "Anda sudah absen masuk.");
          return;
        }
        if (jenis === "Pulang" && serverStatus !== "masuk") {
          showPopup("Gagal", "Anda belum absen masuk.");
          return;
        }

        // Lolos, simpan ke DB!
        try {
          showPopup("Mengirim", "Menyimpan data...");
          await simpanKeDB(
            currentKaryawan.id,
            currentKaryawan.nama,
            jenis,
            currentPos.lat,
            currentPos.lng,
            currentLocationName,
          );
          showPopup(
            "Berhasil",
            jenis === "Masuk"
              ? `Selamat bekerja, ${currentKaryawan.nama}!`
              : "Hati-hati di jalan!",
          );
          updateButtons(); // Update UI
        } catch (e) {
          showPopup("Gagal", "Simpan gagal. Coba lagi.");
        }
      }

      // ===== MODIFIKASI SINKRONISASI AWAL =====
      async function syncStatus(id) {
        const status = await checkStatusFromDB(id);
        if (status === "masuk") {
          showPopup("Status", "Anda sudah absen masuk. Silakan pulang.");
          btnMasuk.disabled = true;
          btnPulang.disabled = false;
        } else {
          showPopup("Status", "Silakan absen masuk.");
          btnMasuk.disabled = false;
          btnPulang.disabled = true;
        }
      }
    </script>
  </body>
</html>
