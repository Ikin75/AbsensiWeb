<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laporan Absensi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f8fafc;
        padding: 20px;
      }
      .container {
        max-width: 1100px;
        margin: auto;
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      }
      h1 {
        font-size: 26px;
        margin-bottom: 5px;
        color: #1e293b;
      }
      .subtitle {
        color: #64748b;
        margin-bottom: 20px;
      }
      .tab-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
      }
      .tab-btn {
        background: #e2e8f0;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        color: #334155;
        transition: 0.2s;
      }
      .tab-btn.active {
        background: #3b82f6;
        color: white;
      }
      .btn {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 15px;
      }
      .btn:hover {
        background: #2563eb;
      }
      .loading {
        text-align: center;
        padding: 30px;
        color: #64748b;
      }

      .filter-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
        flex-wrap: wrap;
      }
      .filter-row label {
        font-weight: 600;
        font-size: 14px;
        color: #334155;
      }
      .filter-row select {
        padding: 6px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        background: white;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }
      th,
      td {
        padding: 10px 12px;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
        font-size: 14px;
      }
      th {
        background: #f1f5f9;
        font-weight: 600;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        margin-top: 20px;
      }
      .status-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        transition: 0.2s;
        position: relative;
      }
      .status-card:hover {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }
      .status-card.warning {
        background: #fff8e1;
        border-color: #f59e0b;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .badge.working {
        background: #dcfce7;
        color: #16a34a;
      }
      .badge.done {
        background: #fee2e2;
        color: #dc2626;
      }
      .badge.warning-badge {
        background: #fef3c7;
        color: #92400e;
      }
      .badge.incomplete {
        background: #e0e7ff;
        color: #3730a3;
      }
      .card-name {
        font-size: 16px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 4px;
      }
      .card-id {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 10px;
      }
      .card-time {
        font-size: 14px;
        margin-bottom: 4px;
      }
      .card-time span {
        color: #475569;
      }
      .wa-btn {
        display: inline-block;
        background: #25d366;
        color: white;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        margin-top: 8px;
      }
      .wa-btn:hover {
        background: #1ebc57;
      }

      /* Rekapan Shift */
      .shift-group {
        margin-bottom: 30px;
      }
      .shift-group h3 {
        font-size: 18px;
        margin-bottom: 10px;
        color: #0f172a;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 5px;
      }
      .shift-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 10px;
      }
      .shift-table th {
        background: #f8fafc;
        font-size: 13px;
      }
      .shift-table td {
        font-size: 13px;
      }
      .text-red {
        color: #dc2626;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📋 Laporan Absensi</h1>
      <p class="subtitle">Data langsung dari database (WIB)</p>

      <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('riwayat')">
          📄 Riwayat
        </button>
        <button class="tab-btn" onclick="switchTab('today')">
          📌 Status Terkini
        </button>
        <button class="tab-btn" onclick="switchTab('rekapan')">
          🗂️ Rekapan Shift
        </button>
      </div>

      <div id="tab-content">
        <div id="riwayat-tab">
          <button class="btn" onclick="downloadExcel()">
            📥 Download Riwayat (.xlsx)
          </button>
          <div id="riwayat-container" class="loading">Memuat data...</div>
        </div>
        <div id="today-tab" style="display: none">
          <div class="filter-row">
            <label for="statusFilter">Filter:</label>
            <select id="statusFilter" onchange="applyFilter()">
              <option value="all">Semua</option>
              <option value="working">Sedang Bekerja</option>
              <option value="done">Sudah Pulang</option>
            </select>
            <button
              class="btn"
              onclick="downloadStatusExcel()"
              style="margin-bottom: 0; margin-left: auto"
            >
              📥 Download (.xlsx)
            </button>
          </div>
          <div id="today-container" class="loading">Memuat data...</div>
        </div>
        <div id="rekapan-tab" style="display: none">
          <button class="btn" onclick="downloadRekapanExcel()">
            📥 Download Rekapan (.xlsx)
          </button>
          <div id="rekapan-container" class="loading">Memuat data...</div>
        </div>
      </div>
    </div>

    <script>
      let allData = [];
      let karyawanData = [];
      let statusSummary = [];

      // ===== HELPER WIB =====
      function formatWIB(isoString) {
        if (!isoString) return "";
        const date = new Date(isoString);
        const options = {
          timeZone: "Asia/Jakarta",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        };
        const formatter = new Intl.DateTimeFormat("id-ID", options);
        const parts = formatter.formatToParts(date);
        const p = {};
        parts.forEach((x) => {
          if (x.type !== "literal") p[x.type] = x.value;
        });
        return `${p.day}-${p.month}-${p.year} ${p.hour}:${p.minute}:${p.second}`;
      }

      function getCurrentWIB() {
        return new Date(
          new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" }),
        );
      }

      // ===== FETCH DATA =====
      // Hapus script supabase dari header (boleh dihapus)
      // Gunakan fetch ke backend lokal
      async function fetchData() {
        try {
          const absensiRes = await fetch("http://localhost:5000/api/absensi");
          const karyawanRes = await fetch("http://localhost:5000/api/karyawan");

          const allData = await absensiRes.json();
          const karyawanData = await karyawanRes.json();

          // sisanya sama persis (buildRiwayat, buildStatusSummary, dll)
          buildRiwayat(allData);
          buildStatusSummary(allData, karyawanData);
          buildRekapanShift(allData);
        } catch (e) {
          document.getElementById("riwayat-container").innerHTML =
            `<p style="color:red;">Gagal memuat data: ${e.message}</p>`;
          document.getElementById("today-container").innerHTML =
            `<p style="color:red;">Gagal memuat data.</p>`;
          document.getElementById("rekapan-container").innerHTML =
            `<p style="color:red;">Gagal memuat data.</p>`;
        }
      }

      // ===== RIWAYAT =====
      function buildRiwayat() {
        const container = document.getElementById("riwayat-container");
        if (allData.length === 0) {
          container.innerHTML = "<p>Tidak ada data.</p>";
          return;
        }
        let html = `<table><thead><tr>
            <th>Tanggal & Waktu (WIB)</th><th>ID</th><th>Nama</th><th>Jenis</th><th>Lokasi</th>
        </tr></thead><tbody>`;
        allData.forEach((r) => {
          html += `<tr><td>${formatWIB(r.created_at)}</td><td>${r.id_karyawan}</td><td>${r.nama}</td><td>${r.jenis}</td><td>${r.lokasi}</td></tr>`;
        });
        html += "</tbody></table>";
        container.innerHTML = html;
      }

      // ===== STATUS TERKINI =====
      function buildStatusSummary() {
        if (allData.length === 0) {
          document.getElementById("today-container").innerHTML =
            "<p>Tidak ada data.</p>";
          statusSummary = [];
          return;
        }
        const grouped = {};
        allData.forEach((r) => {
          const id = r.id_karyawan;
          if (!grouped[id]) grouped[id] = { id, nama: r.nama, records: [] };
          grouped[id].records.push({
            jenis: r.jenis,
            timestamp: new Date(r.created_at),
            lokasi: r.lokasi,
          });
        });

        const summaries = [];
        const nowWIB = getCurrentWIB();
        for (const [id, group] of Object.entries(grouped)) {
          const records = group.records.sort(
            (a, b) => a.timestamp - b.timestamp,
          );
          let lastMasuk = null,
            lastPulang = null;
          records.forEach((r) => {
            if (r.jenis === "Masuk") lastMasuk = r;
            else if (r.jenis === "Pulang") lastPulang = r;
          });

          let status = "none";
          let jamMasuk = null,
            lokasiMasuk = null;
          let jamPulang = null,
            lokasiPulang = null;
          let durationHours = null;

          if (lastMasuk && lastPulang) {
            if (lastPulang.timestamp > lastMasuk.timestamp) {
              status = "done";
              jamMasuk = lastMasuk.timestamp;
              lokasiMasuk = lastMasuk.lokasi;
              jamPulang = lastPulang.timestamp;
              lokasiPulang = lastPulang.lokasi;
            } else {
              status = "working";
              jamMasuk = lastMasuk.timestamp;
              lokasiMasuk = lastMasuk.lokasi;
            }
          } else if (lastMasuk) {
            status = "working";
            jamMasuk = lastMasuk.timestamp;
            lokasiMasuk = lastMasuk.lokasi;
          } else if (lastPulang) {
            status = "done";
            jamPulang = lastPulang.timestamp;
            lokasiPulang = lastPulang.lokasi;
          }

          if (status === "working" && jamMasuk) {
            durationHours = (nowWIB - jamMasuk) / 3600000;
          }

          const kary = karyawanData.find((k) => k.id_karyawan === id);
          const noWa = kary ? kary.no_wa : null;

          summaries.push({
            id: group.id,
            nama: group.nama,
            status,
            jamMasuk: jamMasuk ? formatWIB(jamMasuk) : "-",
            lokasiMasuk: lokasiMasuk || "-",
            jamPulang: jamPulang ? formatWIB(jamPulang) : "-",
            lokasiPulang: lokasiPulang || "-",
            durationHours,
            noWa,
          });
        }
        statusSummary = summaries;
        applyFilter();
      }

      let currentFilter = "all";
      function applyFilter() {
        const container = document.getElementById("today-container");
        const filtered = statusSummary.filter((s) => {
          if (currentFilter === "working") return s.status === "working";
          if (currentFilter === "done") return s.status === "done";
          return true;
        });

        if (filtered.length === 0) {
          container.innerHTML = "<p>Tidak ada data sesuai filter.</p>";
          return;
        }

        let html = '<div class="card-grid">';
        filtered.forEach((s) => {
          let badgeClass = "none",
            badgeText = "Belum ada data";
          let cardClass = "";
          if (s.status === "working") {
            if (s.durationHours !== null && s.durationHours > 9) {
              cardClass = "warning";
              badgeClass = "warning-badge";
              badgeText = "⚠️ Lebih dari 9 jam";
            } else {
              badgeClass = "working";
              badgeText = "Sedang Bekerja";
            }
          } else if (s.status === "done") {
            badgeClass = "done";
            badgeText = "Sudah Pulang";
          }

          html += `
            <div class="status-card ${cardClass}">
                <span class="badge ${badgeClass}">${badgeText}</span>
                <div class="card-name">${s.nama}</div>
                <div class="card-id">ID: ${s.id}</div>
                <div class="card-time"><span>🟢 Masuk:</span> ${s.jamMasuk} (${s.lokasiMasuk})</div>
                <div class="card-time"><span>🔴 Pulang:</span> ${s.jamPulang} ${s.jamPulang !== "-" ? "(" + s.lokasiPulang + ")" : ""}</div>
                ${
                  s.status === "working" &&
                  s.durationHours !== null &&
                  s.durationHours > 9 &&
                  s.noWa
                    ? `
                <a class="wa-btn" href="https://wa.me/${s.noWa}?text=${encodeURIComponent("Halo " + s.nama + ", Anda sudah bekerja lebih dari 9 jam (masuk " + s.jamMasuk + "). Mohon segera absen pulang.")}" target="_blank">Hubungi via WA</a>
                `
                    : ""
                }
            </div>`;
        });
        html += "</div>";
        container.innerHTML = html;
      }

      // ===== REKAPAN SHIFT =====
      function buildRekapanShift() {
        const container = document.getElementById("rekapan-container");
        if (allData.length === 0) {
          container.innerHTML = "<p>Tidak ada data.</p>";
          return;
        }

        // Kelompokkan per ID, lalu urutkan per timestamp
        const grouped = {};
        allData.forEach((r) => {
          const id = r.id_karyawan;
          if (!grouped[id]) grouped[id] = { id, nama: r.nama, records: [] };
          grouped[id].records.push({
            jenis: r.jenis,
            timestamp: new Date(r.created_at),
            lokasi: r.lokasi,
          });
        });

        let html = "";
        for (const [id, group] of Object.entries(grouped)) {
          const records = group.records.sort(
            (a, b) => a.timestamp - b.timestamp,
          );
          const pairs = [];
          let currentMasuk = null;

          records.forEach((r) => {
            if (r.jenis === "Masuk") {
              // Jika ada masuk sebelumnya yang belum punya pulang, simpan dulu sebagai incomplete
              if (currentMasuk) {
                pairs.push({ masuk: currentMasuk, pulang: null });
              }
              currentMasuk = r;
            } else if (r.jenis === "Pulang") {
              if (currentMasuk) {
                pairs.push({ masuk: currentMasuk, pulang: r });
                currentMasuk = null;
              } else {
                // Pulang tanpa masuk (seharusnya jarang)
                pairs.push({ masuk: null, pulang: r });
              }
            }
          });
          // Jika masih ada masuk yang belum pulang
          if (currentMasuk) {
            pairs.push({ masuk: currentMasuk, pulang: null });
          }

          if (pairs.length === 0) continue;

          html += `<div class="shift-group">
                <h3>${group.nama} (${id})</h3>
                <table class="shift-table">
                    <thead><tr>
                        <th>Masuk</th><th>Lokasi Masuk</th>
                        <th>Pulang</th><th>Lokasi Pulang</th>
                        <th>Durasi</th><th>Status</th>
                    </tr></thead><tbody>`;

          pairs.forEach((pair) => {
            const masukWaktu = pair.masuk
              ? formatWIB(pair.masuk.timestamp)
              : "-";
            const masukLok = pair.masuk ? pair.masuk.lokasi : "-";
            const pulangWaktu = pair.pulang
              ? formatWIB(pair.pulang.timestamp)
              : '<span class="text-red">BELUM PULANG</span>';
            const pulangLok = pair.pulang ? pair.pulang.lokasi : "-";
            let durasi = "-";
            let statusText = "";
            let rowStyle = "";

            if (pair.masuk && pair.pulang) {
              const diffMs = pair.pulang.timestamp - pair.masuk.timestamp;
              const diffHours = diffMs / 3600000;
              durasi = `${Math.floor(diffHours)} jam ${Math.floor((diffHours % 1) * 60)} menit`;
              statusText = "✅ Lengkap";
            } else if (pair.masuk && !pair.pulang) {
              durasi = "-";
              statusText = "⚠️ Belum Pulang";
              rowStyle = 'style="background: #fffbeb;"';
            } else if (!pair.masuk && pair.pulang) {
              durasi = "-";
              statusText = "❓ Tidak Ada Masuk";
              rowStyle = 'style="background: #fee2e2;"';
            }

            html += `<tr ${rowStyle}>
                    <td>${masukWaktu}</td><td>${masukLok}</td>
                    <td>${pulangWaktu}</td><td>${pulangLok}</td>
                    <td>${durasi}</td><td>${statusText}</td>
                </tr>`;
          });

          html += "</tbody></table></div>";
        }

        container.innerHTML = html || "<p>Tidak ada data shift.</p>";
        window.rekapanData = allData; // untuk download
      }

      // ===== DOWNLOAD =====
      function downloadExcel() {
        if (allData.length === 0) return alert("Tidak ada data.");
        const data = allData.map((r) => ({
          Tanggal: formatWIB(r.created_at),
          ID: r.id_karyawan,
          Nama: r.nama,
          Jenis: r.jenis,
          Lokasi: r.lokasi,
        }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Riwayat");
        XLSX.writeFile(
          wb,
          `riwayat_absensi_${new Date().toISOString().slice(0, 10)}.xlsx`,
        );
      }

      function downloadStatusExcel() {
        const filtered = statusSummary.filter((s) => {
          if (currentFilter === "working") return s.status === "working";
          if (currentFilter === "done") return s.status === "done";
          return true;
        });
        if (filtered.length === 0) return alert("Tidak ada data.");
        const data = filtered.map((s) => ({
          ID: s.id,
          Nama: s.nama,
          Status:
            s.status === "working"
              ? "Sedang Bekerja"
              : s.status === "done"
                ? "Sudah Pulang"
                : "Belum data",
          "Jam Masuk": s.jamMasuk,
          "Lokasi Masuk": s.lokasiMasuk,
          "Jam Pulang": s.jamPulang,
          "Lokasi Pulang": s.lokasiPulang,
          "Durasi (jam)":
            s.durationHours !== null
              ? Math.round(s.durationHours * 10) / 10
              : "-",
        }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Status Terkini");
        XLSX.writeFile(
          wb,
          `status_terkini_${new Date().toISOString().slice(0, 10)}.xlsx`,
        );
      }

      function downloadRekapanExcel() {
        // Membuat ringkasan pasangan shift untuk Excel
        const rows = [];
        const grouped = {};
        allData.forEach((r) => {
          const id = r.id_karyawan;
          if (!grouped[id]) grouped[id] = { id, nama: r.nama, records: [] };
          grouped[id].records.push({
            jenis: r.jenis,
            timestamp: new Date(r.created_at),
            lokasi: r.lokasi,
          });
        });

        for (const [id, group] of Object.entries(grouped)) {
          const records = group.records.sort(
            (a, b) => a.timestamp - b.timestamp,
          );
          let currentMasuk = null;
          records.forEach((r) => {
            if (r.jenis === "Masuk") {
              if (currentMasuk)
                rows.push({
                  ID: id,
                  Nama: group.nama,
                  Masuk: formatWIB(currentMasuk.timestamp),
                  "Lokasi Masuk": currentMasuk.lokasi,
                  Pulang: "BELUM PULANG",
                  "Lokasi Pulang": "",
                  Durasi: "",
                });
              currentMasuk = r;
            } else if (r.jenis === "Pulang") {
              const masuk = currentMasuk;
              const pulang = r;
              const durasi = masuk
                ? ((pulang.timestamp - masuk.timestamp) / 3600000).toFixed(1) +
                  " jam"
                : "";
              rows.push({
                ID: id,
                Nama: group.nama,
                Masuk: masuk ? formatWIB(masuk.timestamp) : "-",
                "Lokasi Masuk": masuk ? masuk.lokasi : "",
                Pulang: formatWIB(pulang.timestamp),
                "Lokasi Pulang": pulang.lokasi,
                Durasi: durasi,
              });
              currentMasuk = null;
            }
          });
          if (currentMasuk) {
            rows.push({
              ID: id,
              Nama: group.nama,
              Masuk: formatWIB(currentMasuk.timestamp),
              "Lokasi Masuk": currentMasuk.lokasi,
              Pulang: "BELUM PULANG",
              "Lokasi Pulang": "",
              Durasi: "",
            });
          }
        }

        if (rows.length === 0) return alert("Tidak ada data.");
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Rekapan Shift");
        XLSX.writeFile(
          wb,
          `rekapan_shift_${new Date().toISOString().slice(0, 10)}.xlsx`,
        );
      }

      // ===== TAB SWITCH =====
      function switchTab(tabName) {
        document
          .querySelectorAll(".tab-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document.getElementById("riwayat-tab").style.display = "none";
        document.getElementById("today-tab").style.display = "none";
        document.getElementById("rekapan-tab").style.display = "none";

        if (tabName === "riwayat") {
          document
            .querySelector(".tab-btn:nth-child(1)")
            .classList.add("active");
          document.getElementById("riwayat-tab").style.display = "block";
        } else if (tabName === "today") {
          document
            .querySelector(".tab-btn:nth-child(2)")
            .classList.add("active");
          document.getElementById("today-tab").style.display = "block";
          document.getElementById("statusFilter").value = "all";
          applyFilter();
        } else if (tabName === "rekapan") {
          document
            .querySelector(".tab-btn:nth-child(3)")
            .classList.add("active");
          document.getElementById("rekapan-tab").style.display = "block";
        }
      }

      fetchData();
    </script>
